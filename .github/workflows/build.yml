name: Build & Release APK

on:
  push:
    branches: [ "main", "master", "arena/19c7b403-nothing-launcher" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DotOS Launcher APK
    runs-on: ubuntu-latest
    # Skip rebuilding if commit only updates prebuilt APK binaries or docs
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-ci-build]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache signing keystore
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: dotos-launcher-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace > build-output.log 2>&1
          code=$?
          tail -n 60 build-output.log
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          set +e
          if [ ! -f build-output.log ]; then
            echo "::error::Gradle build failed (no build-output.log found)."
            exit 0
          fi
          {
            echo "=== FAILURE SUMMARY ==="
            grep -E "FAILURE:|What went wrong|Execution failed|Caused by" build-output.log | head -n 40
            echo ""
            echo "=== WHAT WENT WRONG (detail) ==="
            sed -n '/What went wrong/,/^\* Try/p' build-output.log | head -n 40
            echo ""
            echo "=== KOTLIN ERRORS ==="
            grep -E "^e: |\.kt:[0-9]+:[0-9]+: error" build-output.log | head -n 60
            echo ""
            echo "=== FAILED TASKS ==="
            grep -E "FAILED" build-output.log | head -n 20
          } > failure-summary.txt
          esc() { sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          split -b 2200 failure-summary.txt chunk_
          for f in chunk_*; do
            echo "::error::$(cat "$f" | esc)"
          done

      - name: Verify APK signature and stage v1.1 output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DotOS-Launcher-v1.1.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/DotOS-Launcher-v1.1.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dotos-launcher-v1.1-apk
          path: dist/DotOS-Launcher-v1.1.apk
          if-no-files-found: error

      - name: Create/Update GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'EOF'
          ### DotOS Launcher v1.1 (In-Place Update)
          Install **DotOS-Launcher-v1.1.apk** directly over v1.0 — keeps all your apps, layout, and settings!

          **What's New in v1.1:**
          - **Smooth 120Hz App Drawer Scrolling:** Lock-free in-memory icon cache, skippable pre-computed drawer tiles, recycled item content types, and automatic pause of background live-wallpaper rendering while overlays are open.
          - **Instant Home Return (Never Stops on Exit):** Keeps state warm in memory (`Eagerly` flows), preserves Activity across config changes, keeps widget host bound, and replaces on-resume full app re-scans with event-driven package monitoring.
          - **Enlarge / Shrink Widgets & Long-Press Home Customize:** Long-press anywhere on the Home Screen or on any Widget to enter Edit Mode — resize widget height (`S` / `M` / `L` / `XL` or exact `96dp–340dp` slider), switch between **Full Width** and **Half Width (`1/2`, side-by-side)**, scale widget text/content, add/remove widget blocks, and adjust home grid columns & icon size live.
          EOF
          )
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 dist/DotOS-Launcher-v1.1.apk --clobber
            gh release edit v1.1.0 --title "DotOS Launcher v1.1" --notes "$NOTES" --latest
          else
            gh release create v1.1.0 dist/DotOS-Launcher-v1.1.apk \
              --target "${{ github.sha }}" \
              --title "DotOS Launcher v1.1" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Publish APK manifest for workspace sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess

          apk_path = "dist/DotOS-Launcher-v1.1.apk"
          with open(apk_path, "rb") as f:
              data = f.read()
          sha256 = hashlib.sha256(data).hexdigest()
          chunk_size = 6 * 1024 * 1024
          repo = os.environ["GITHUB_REPOSITORY"]
          shas = []
          for i in range(0, len(data), chunk_size):
              chunk = data[i:i + chunk_size]
              with open("/tmp/blob_payload.json", "w") as pf:
                  json.dump({
                      "content": base64.b64encode(chunk).decode("ascii"),
                      "encoding": "base64"
                  }, pf)
              sha = subprocess.check_output([
                  "gh", "api", f"repos/{repo}/git/blobs",
                  "--method", "POST",
                  "--input", "/tmp/blob_payload.json",
                  "--jq", ".sha"
              ], text=True).strip()
              shas.append(sha)
          manifest = {
              "apk": os.path.basename(apk_path),
              "size": len(data),
              "sha256": sha256,
              "blobs": shas,
          }
          print(f"::notice title=APK_MANIFEST::{json.dumps(manifest)}")
          PY
