name: Build APK

on:
  push:
    branches: [ "main", "master", "arena/19c7b403-nothing-launcher" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        id: build
        run: |
          set +e
          ./gradlew assembleDebug assembleRelease --stacktrace > build-output.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 60 build-output.log
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          if [ -f build-output.log ]; then
            echo "::error::Gradle build failed. Last 120 lines of output:"
            tail -n 120 build-output.log | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | while IFS= read -r line; do echo "::error::$line"; done
          else
            echo "::error::Gradle build failed (no build-output.log found)."
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: dotos-launcher-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
