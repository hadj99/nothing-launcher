name: Build & Release APK

on:
  push:
    branches: [ "main", "master", "arena/19c7b403-nothing-launcher" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DotOS Launcher APK
    runs-on: ubuntu-latest
    # Skip rebuilding if commit only updates prebuilt APK binaries or docs
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-ci-build]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache signing keystore
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: dotos-launcher-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set +e
          ./gradlew assembleRelease --stacktrace > build-output.log 2>&1
          code=$?
          tail -n 60 build-output.log
          exit $code

      - name: Report build failure
        if: failure()
        run: |
          set +e
          if [ ! -f build-output.log ]; then
            echo "::error::Gradle build failed (no build-output.log found)."
            exit 0
          fi
          {
            echo "=== FAILURE SUMMARY ==="
            grep -E "FAILURE:|What went wrong|Execution failed|Caused by" build-output.log | head -n 40
            echo ""
            echo "=== WHAT WENT WRONG (detail) ==="
            sed -n '/What went wrong/,/^\* Try/p' build-output.log | head -n 40
            echo ""
            echo "=== KOTLIN ERRORS ==="
            grep -E "^e: |\.kt:[0-9]+:[0-9]+: error" build-output.log | head -n 60
            echo ""
            echo "=== FAILED TASKS ==="
            grep -E "FAILED" build-output.log | head -n 20
          } > failure-summary.txt
          esc() { sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          split -b 2200 failure-summary.txt chunk_
          for f in chunk_*; do
            echo "::error::$(cat "$f" | esc)"
          done

      - name: Verify APK signature and stage v1.2 output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DotOS-Launcher-v1.2.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/DotOS-Launcher-v1.2.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dotos-launcher-v1.2-apk
          path: dist/DotOS-Launcher-v1.2.apk
          if-no-files-found: error

      - name: Create/Update GitHub Release v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'EOF'
          ### DotOS Launcher v1.2 (Major Performance Overhaul — In-Place Update)
          Install **DotOS-Launcher-v1.2.apk** directly over v1.0 or v1.1 — same package ID and signing key, so all your apps, layouts, and settings stay intact!

          **What Fixed the Lag in v1.2:**
          - **Full R8 Release Optimization & Shrinking Enabled (`isMinifyEnabled = true`):** Previously shipped unminified with 3 multidex files and un-inlined Compose runtime; R8 now inlines Compose lambdas/value classes and strips ~25k unused icon classes into a compact, AOT-friendly release binary.
          - **Native 90Hz / 120Hz / 144Hz Display Mode Unlocked:** Requests the display's highest native refresh rate directly on the launcher window so OEM window managers no longer cap the launcher at 60Hz.
          - **Pre-Baked Flat GPU Icon Textures (`BakedIconMemoryCache`):** Masks, borders, shapes, filters, and dot overlays are pre-rendered once on `Dispatchers.Default` into flat `136x136` `ARGB_8888` textures — eliminating ~30 hardware `Modifier.clip()` / `Modifier.border()` offscreen layers and `RippleNode` allocations per scroll frame in the App Drawer.
          - **Batched Native `drawPoints` Wallpaper & Deferred Draw-Phase Animations:** Replaced ~2,015 JNI `drawCircle` calls/frame + `@Composable`-scope animation state reads with 4 batched `Canvas.drawPoints` calls and draw-scope-only reads (0 recompositions per frame).
          - **Pre-Warmed Placement-Gated App Drawer & Zero Fullscreen Overdraw:** App Drawer stays pre-composed in memory (0ms open latency) with a solid opaque surface, and `HomeScreenCanvas` unplaces while covered so 100% of GPU budget goes to scrolling.
          - **Zero Main-Thread Binder IPC & Throttled Lifecycle-Aware Sensors:** Moved `ContextAutomationEngine` telemetry/Bluetooth reflection off the main thread onto `Dispatchers.IO`, added accelerometer noise deadband filtering, and paused all sensors/timers when backgrounded or covered.
          EOF
          )
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 dist/DotOS-Launcher-v1.2.apk --clobber
            gh release edit v1.2.0 --title "DotOS Launcher v1.2" --notes "$NOTES" --latest
          else
            gh release create v1.2.0 dist/DotOS-Launcher-v1.2.apk \
              --target "${{ github.sha }}" \
              --title "DotOS Launcher v1.2" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Publish APK manifest for workspace sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess

          apk_path = "dist/DotOS-Launcher-v1.2.apk"
          with open(apk_path, "rb") as f:
              data = f.read()
          sha256 = hashlib.sha256(data).hexdigest()
          chunk_size = 6 * 1024 * 1024
          repo = os.environ["GITHUB_REPOSITORY"]
          shas = []
          for i in range(0, len(data), chunk_size):
              chunk = data[i:i + chunk_size]
              with open("/tmp/blob_payload.json", "w") as pf:
                  json.dump({
                      "content": base64.b64encode(chunk).decode("ascii"),
                      "encoding": "base64"
                  }, pf)
              sha = subprocess.check_output([
                  "gh", "api", f"repos/{repo}/git/blobs",
                  "--method", "POST",
                  "--input", "/tmp/blob_payload.json",
                  "--jq", ".sha"
              ], text=True).strip()
              shas.append(sha)
          manifest = {
              "apk": os.path.basename(apk_path),
              "size": len(data),
              "sha256": sha256,
              "blobs": shas,
          }
          print(f"::notice title=APK_MANIFEST::{json.dumps(manifest)}")
          PY
