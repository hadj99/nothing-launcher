name: Build & Publish APK

on:
  push:
    branches: [ "main", "master", "arena/19c7b403-nothing-launcher" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-prebuilt:
    name: Publish APK to Releases & Packages
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.changes.outputs.rebuild }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if source changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          elif [ ! -f DotOS-Launcher-v1.0.apk ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD~1 >/dev/null 2>&1 && git diff --name-only HEAD~1 HEAD | grep -qE '\.(kt|kts|xml|toml|pro|properties)$'; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish prebuilt APK to GitHub Releases
        if: steps.changes.outputs.rebuild == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 DotOS-Launcher-v1.0.apk --clobber
          else
            gh release create v1.0.0 DotOS-Launcher-v1.0.apk \
              --target "${{ github.sha }}" \
              --title "DotOS Launcher v1.0" \
              --notes "Installable Android APK for **DotOS Launcher** (Android 7.0+ / API 24+). Tap **DotOS-Launcher-v1.0.apk** below under Assets to download and install on your Android phone."
          fi

      - name: Publish prebuilt APK to GitHub Packages
        if: steps.changes.outputs.rebuild == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          mvn -B deploy:deploy-file \
            -DgroupId=com.aistudio.dotoslauncher \
            -DartifactId=dotos-launcher \
            -Dversion=1.0.${GITHUB_RUN_NUMBER} \
            -Dpackaging=apk \
            -Dfile=DotOS-Launcher-v1.0.apk \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${REPO_LOWER}"

  build-from-source:
    name: Build APK from Source
    needs: publish-prebuilt
    if: needs.publish-prebuilt.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache signing keystore
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: dotos-launcher-signing-keystore-v1

      - name: Ensure signing keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APK signatures and stage output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DotOS-Launcher-v1.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/DotOS-Launcher-v1.0-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/DotOS-Launcher-v1.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/DotOS-Launcher-v1.0-debug.apk

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dotos-launcher-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/DotOS-Launcher-v1.0.apk dist/DotOS-Launcher-v1.0-debug.apk --clobber
          else
            gh release create v1.0.0 dist/DotOS-Launcher-v1.0.apk dist/DotOS-Launcher-v1.0-debug.apk \
              --target "${{ github.sha }}" \
              --title "DotOS Launcher v1.0" \
              --notes "Installable Android APKs for **DotOS Launcher** (Android 7.0+ / API 24+)."
          fi

      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          mvn -B deploy:deploy-file \
            -DgroupId=com.aistudio.dotoslauncher \
            -DartifactId=dotos-launcher \
            -Dversion=1.0.${GITHUB_RUN_NUMBER} \
            -Dpackaging=apk \
            -Dfile=dist/DotOS-Launcher-v1.0.apk \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${REPO_LOWER}"
